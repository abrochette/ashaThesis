<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="300" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#333">
    mRNA Structure and CDS Binning for Ribosome Profiling Analysis
  </text>
  
  <!-- mRNA strand -->
  <line x1="50" y1="100" x2="750" y2="100" stroke="#333" stroke-width="3"/>
  
  <!-- 5' UTR -->
  <rect x="50" y="85" width="120" height="30" fill="#e6f3ff" stroke="#0066cc" stroke-width="2" rx="5"/>
  <text x="110" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0066cc">
    5' UTR
  </text>
  
  <!-- Start Codon -->
  <rect x="170" y="85" width="40" height="30" fill="#90EE90" stroke="#228B22" stroke-width="2" rx="5"/>
  <text x="190" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#228B22">
    START
  </text>
  <text x="190" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#228B22">
    AUG
  </text>
  
  <!-- Skip 5' region (45 nt) -->
  <rect x="210" y="85" width="60" height="30" fill="#ffeecc" stroke="#ff9900" stroke-width="1" stroke-dasharray="5,5" rx="5"/>
  <text x="240" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#ff9900">
    Skip 45nt
  </text>
  
  <!-- CDS with 4 bins -->
  <!-- Bin 1 -->
  <rect x="270" y="85" width="90" height="30" fill="#0099c6" stroke="#006699" stroke-width="2" rx="5"/>
  <text x="315" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Bin 1
  </text>
  
  <!-- Bin 2 -->
  <rect x="360" y="85" width="90" height="30" fill="#17becf" stroke="#0e8a99" stroke-width="2" rx="5"/>
  <text x="405" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Bin 2
  </text>
  
  <!-- Bin 3 -->
  <rect x="450" y="85" width="90" height="30" fill="#19d3f3" stroke="#0fa0c2" stroke-width="2" rx="5"/>
  <text x="495" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Bin 3
  </text>
  
  <!-- Bin 4 -->
  <rect x="540" y="85" width="90" height="30" fill="#00b5f7" stroke="#0082c6" stroke-width="2" rx="5"/>
  <text x="585" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Bin 4
  </text>
  
  <!-- Skip 3' region (15 nt) -->
  <rect x="630" y="85" width="40" height="30" fill="#ffeecc" stroke="#ff9900" stroke-width="1" stroke-dasharray="5,5" rx="5"/>
  <text x="650" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#ff9900">
    Skip 15nt
  </text>
  
  <!-- Stop Codon -->
  <rect x="670" y="85" width="40" height="30" fill="#ffb3b3" stroke="#cc0000" stroke-width="2" rx="5"/>
  <text x="690" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#cc0000">
    STOP
  </text>
  <text x="690" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#cc0000">
    UAG/UAA/UGA
  </text>
  
  <!-- 3' UTR -->
  <rect x="710" y="85" width="40" height="30" fill="#e6f3ff" stroke="#0066cc" stroke-width="2" rx="5"/>
  <text x="730" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0066cc">
    3' UTR
  </text>
  
  <!-- Labels and arrows -->
  <!-- CDS label -->
  <text x="455" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">
    Coding Sequence (CDS)
  </text>
  <line x1="270" y1="78" x2="630" y2="78" stroke="#333" stroke-width="1"/>
  <polygon points="270,75 275,78 270,81" fill="#333"/>
  <polygon points="630,75 625,78 630,81" fill="#333"/>
  
  <!-- Explanation text -->
  <text x="50" y="160" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">
    Analysis Process:
  </text>
  <text x="50" y="180" font-family="Arial, sans-serif" font-size="11" fill="#333">
    1. Skip 45 nucleotides from start codon and 15 nucleotides before stop codon
  </text>
  <text x="50" y="195" font-family="Arial, sans-serif" font-size="11" fill="#333">
    2. Divide remaining CDS into 4 equal bins
  </text>
  <text x="50" y="210" font-family="Arial, sans-serif" font-size="11" fill="#333">
    3. Count ribosome footprint reads in each bin
  </text>
  <text x="50" y="225" font-family="Arial, sans-serif" font-size="11" fill="#333">
    4. Normalize counts to show read distribution pattern across the gene
  </text>
  
  <!-- Legend -->
  <text x="50" y="255" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">
    Purpose:
  </text>
  <text x="50" y="275" font-family="Arial, sans-serif" font-size="11" fill="#333">
    Reveals ribosome density patterns - uniform distribution indicates normal translation,
  </text>
  <text x="50" y="290" font-family="Arial, sans-serif" font-size="11" fill="#333">
    while skewed patterns may indicate ribosome pausing, stalling, or regulatory elements.
  </text>
</svg>
