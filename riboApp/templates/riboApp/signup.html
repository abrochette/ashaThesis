{% extends 'riboApp/base.html' %}

{% block content %}
<div style="max-width: 400px; margin: 50px auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px;">
    <h2 style="text-align: center; color: #333;">Create Account</h2>
    
    {% if messages %}
        {% for message in messages %}
            <div style="padding: 10px; margin-bottom: 15px; border-radius: 4px; 
                        {% if message.tags %}background-color: {% if 'error' in message.tags %}#ffebee{% else %}#e8f5e9{% endif %};
                        color: {% if 'error' in message.tags %}#c62828{% else %}#2e7d32{% endif %};{% endif %}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}
    
    <form method="post" style="display: flex; flex-direction: column;">
        {% csrf_token %}
        
        <label for="username" style="margin-top: 15px; font-weight: 500; color: #333;">Username:</label>
        <input type="text" id="username" name="username" required 
               style="padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px;">
        
        <label for="email" style="margin-top: 15px; font-weight: 500; color: #333;">Email (optional):</label>
        <input type="email" id="email" name="email" 
               style="padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px;">
        
        <label for="password" style="margin-top: 15px; font-weight: 500; color: #333;">Password:</label>
        <input type="password" id="password" name="password" required 
               style="padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px;">
        
        <label for="password_confirm" style="margin-top: 15px; font-weight: 500; color: #333;">Confirm Password:</label>
        <input type="password" id="password_confirm" name="password_confirm" required 
               style="padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px;">
        
        <button type="submit" style="margin-top: 20px; padding: 10px; background-color: #000; color: white; 
                                     border: none; border-radius: 4px; font-size: 14px; cursor: pointer;">
            Sign Up
        </button>
    </form>
    
    <p style="text-align: center; margin-top: 20px; color: #666;">
        Already have an account? <a href="{% url 'login' %}" style="color: #5B9BD5; text-decoration: none;">Login here</a>
    </p>
</div>
{% endblock %}
