{% extends 'riboApp/base.html' %}

{% block content %}
    <h1>PCA of Gene Counts</h1>

    {% if error_message %}
        <div style="background-color: #f8d7da; color: #721c24; padding: 15px; border-radius: 5px; margin: 15px 0; border-left: 4px solid #dc3545;">
            <strong>Error:</strong> {{ error_message }}
        </div>
    {% else %}
        <div style="margin-bottom: 15px;">
            <a href="{% url 'download_csv' 'pca' %}"
               style="background-color: #28a745; color: white; padding: 8px 15px; text-decoration: none; border-radius: 5px; display: inline-block;">
                📊 Download PCA Data as CSV
            </a>
        </div>
        <div>{{ pca_plot|safe }}</div>
    {% endif %}
{% endblock %}
