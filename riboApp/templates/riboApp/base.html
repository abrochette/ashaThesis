<!DOCTYPE html>
{% load crispy_forms_tags %}
<html>

<head>
  <title>Ribo App</title>
  <link rel="stylesheet" type="text/css" href="https://bootswatch.com/5/lux/bootstrap.min.css">
  <style>
    /* Color palette */
    :root {
      --primary-blue: #4a7ba7;
      --light-blue: #e8f1f7;
      --accent-pink: #d4a5d4;
      --light-pink: #f5e6f5;
      --text-dark: #3d3d3d;
      --text-light: #666666;
      --border-color: #c9d6e0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--text-dark);
    }

    /* top bar */
    .topBar {
      background-color: #000000;
      overflow: hidden;
      display: flex;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    /* text inside top bar */
    .topBar a {
      color: white;
      padding: 14px 20px;
      text-align: center;
      text-decoration: none;
      display: block;
      font-size: 15px;
      font-weight: 400;
      transition: all 0.2s ease;
    }

    /* change color when hovering */
    .topBar a:hover {
      background-color: rgba(255, 255, 255, 0.1);
      color: white;
    }

    .topBar a.active {
      background-color: #ffffff;
      color: #000000;
      border-bottom: 3px solid #ffffff;
    }

    #content {
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    /* Button styling */
    .btn-primary {
      background-color: var(--primary-blue) !important;
      border-color: var(--primary-blue) !important;
      color: white !important;
    }

    .btn-primary:hover {
      background-color: #3d6a8f !important;
      border-color: #3d6a8f !important;
    }
  </style>
</head>

<body>
  <div class="topBar">
    <a href="/home" class="{% if request.resolver_match.url_name == 'home' %}active{% endif %}">Home</a>
    <a href="/preprocess" class="{% if request.resolver_match.url_name == 'preprocess' %}active{% endif %}">Pre-Processing</a>
    <a href="/psiteOffset/" class="{% if request.resolver_match.url_name == 'psiteOffset' %}active{% endif %}">P-site Analysis</a>
    <a href="/upload" class="{% if request.resolver_match.url_name == 'upload_parquet' %}active{% endif %}">Analysis</a>
  </div>

  <div id="content" name="content">
    {% block content %}
    {% endblock %}
  </div>
</body>

</html>
